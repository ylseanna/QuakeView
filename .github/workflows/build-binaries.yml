name: Build binaries
run-name: ${{ github.actor }} is building binaries
on:
  workflow_dispatch:

jobs:
  Build-Binaries-Windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "${{ github.repository }} repository has been cloned to the runner."

      - run: echo "Branch - ${{ github.ref }}, repository - ${{ github.repository }}."

      - run: cd ${{ github.workspace }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.2.0"
          cache: "npm"
          cache-dependency-path: ${{ github.workspace }}/package-lock.json

      - run: npm ci --only=prod # or yarn install

      - name: Setup esbuild
        run: npm install @esbuild/win32-x64

      - run: npm list

      - name: Install python dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # caching pip dependencies
      - run: pip install -r ${{ github.workspace }}/flask/requirements.txt pyinstaller

      - run: pip freeze

      - name: List files in the repository
        run: ls

      - name: Build
        run: npm run build

      - name: Create binaries
        run: npm run dist:msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OS: win32-x64

      - run: echo "Job status is ${{ job.status }}."
