asar: true
productName: "QuakeView"
appId: "frl.ylse.quakeview"
asarUnpack:
  [
    "node_modules/next",
    "node_modules/@img",
    "node_modules/sharp",
    "**\\*.{node,dll}",
  ]
files:
  [
    "out",
    "next",
    "public",
    {
      "from": "./.next/",
      "to": ".next/",
      "filter": ["**/*", "!**/cache", "!**/dev"],
    },
  ]
linux:
  {
    target: ["deb"],
    artifactName: "quakeview_${version}_${env.OS}_${arch}.${ext}",
    category: "Science",
  }
win:
  {
    target: ["nsis"],
    publish: ["github"],
    artifactName: "quakeview_${version}_${env.OS}_${arch}.${ext}",
  }
mac:
  {
    target: ["pkg"],
    publish: ["github"],
    artifactName: "quakeview_${version}_${env.OS}_${arch}.${ext}",
    arch: ["arm64"],
  }
extraResources: [{ from: "flask/dist", to: "flask" }]
directories: { buildResources: "resources", output: "release" }
